name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest -q

  retrieval-eval:
    # Keyless: builds the three indexes with fastembed and checks retrieval quality.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run afbench index
      - run: uv run afbench retrieval
      - name: Answer-chunk Hit@5 of the matched variants stays above 0.8
        run: |
          uv run python - <<'PY'
          import json, sys
          from afbench.stack import MATCHED
          data = json.load(open("results/retrieval.json"))
          low = {v: data[v]["summary"]["evidence_hit_at_5"] for v in MATCHED.values() if data[v]["summary"]["evidence_hit_at_5"] < 0.8}
          print(low or "ok")
          sys.exit(1 if low else 0)
          PY

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
